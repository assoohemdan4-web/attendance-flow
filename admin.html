<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{

margin:0;
padding:30px;
background:#edf2f7;
font-family:Poppins,sans-serif;

}

.container{

max-width:1100px;
margin:auto;

}

.card{

background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);

}

h1{

margin-top:0;

}

input[type=file]{

margin-top:20px;
margin-bottom:20px;

}

.stats{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:20px;

margin-bottom:25px;

}

.box{

background:#f5f7fb;

padding:20px;

border-radius:15px;

text-align:center;

}

.box h2{

margin:0;

font-size:30px;

color:#1e3a8a;

}

.box p{

margin:10px 0 0;

}

table{

width:100%;

border-collapse:collapse;

}

th,td{

border:1px solid #ddd;

padding:10px;

text-align:center;

font-size:14px;

}

th{

background:#1e3a8a;

color:white;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Attendance Admin Dashboard</h1>

<input type="file" id="excelFile" accept=".xlsx,.xls">

<div class="stats">

<div class="box">

<h2 id="sheetCount">0</h2>

<p>Sheets</p>

</div>

<div class="box">

<h2 id="employeeCount">0</h2>

<p>Employees</p>

</div>

<div class="box">

<h2 id="rowCount">0</h2>

<p>Rows</p>

</div>

</div>

<table id="preview"></table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="admin.js?v=7"></script>

</body>

</html>
